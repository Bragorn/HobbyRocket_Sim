<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hobby Rocket Sim</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101418; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- Plain scripts, loaded in this order. No modules, so the game opens
     by double-clicking this file. Each file has one job. -->
<script src="js/data.js"></script>        <!-- numbers and settings you tune -->
<script src="js/telemetry.js"></script>   <!-- recorder, flight log, CSV -->
<script src="js/sim.js"></script>         <!-- the physics -->
<script src="js/camera.js"></script>      <!-- meters to pixels -->
<script src="js/render.js"></script>      <!-- drawing the world -->
<script src="js/hud.js"></script>         <!-- text panels and graphs -->
<script src="js/input.js"></script>       <!-- keyboard -->
<script src="js/main.js"></script>        <!-- the game loop, starts everything -->
</body>
</html>
