<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step 1: does planck.js survive planet scale?</title>
<style>
  body { margin: 0; background: #101418; color: #e8eef2; font: 13px/1.4 monospace; padding: 12px; }
  button { font: inherit; color: #e8eef2; background: #1b242c; border: 1px solid rgba(255,255,255,0.25);
           padding: 6px 10px; margin: 0 6px 6px 0; cursor: pointer; }
  button:hover { background: #26333d; }
  canvas { display: block; margin: 6px 0; border: 1px solid rgba(255,255,255,0.15); }
  pre { white-space: pre-wrap; margin: 0; }
</style>
</head>
<body>
<div>
  <b>Step 1: planck.js at planet scale</b> (600 km planet, 9.81 m/s2 at the surface, gravity points at the planet's center)<br><br>
  <button id="b1">1. Drop a rocket-shaped box on the planet (circle ground)</button>
  <button id="b2">2. Drop it on edge ground (flat segments)</button><br>
  <button id="b3">3. Orbit test: default engine limits</button>
  <button id="b4">4. Orbit test: raised engine limits</button>
  <button id="b5">Clear log</button>
</div>
<canvas id="view" width="700" height="340"></canvas>
<pre id="log"></pre>

<script src="js/planck.min.js"></script>
<script>
"use strict";

const logEl = document.getElementById("log");
function log(s) { logEl.textContent += s + "\n"; }

if (typeof planck === "undefined") {
  log("planck was not found. Check that the file is at js/planck.min.js next to this page and that it is the plain\n" +
      "planck.min.js (a long block of code), not a web page. Then reload.");
  throw new Error("planck missing");
}

log("planck loaded. Exported names that mention settings or units: " +
    (Object.keys(planck).filter(k => /setting|unit|length|translation/i.test(k)).join(", ") || "(none)"));

const R = 600000;                    // planet radius, m
const G0 = 9.81;                     // surface gravity, m/s2
const MU = G0 * R * R;               // gravity strength: force = m * MU / r^2
const DT = 1 / 60;                   // physics step, s

const V = (x, y) => new planck.Vec2(x, y);

function makeWorld() { return new planck.World({ gravity: V(0, 0) }); }

function addGravity(world) {         // pull every dynamic body toward the planet's center (0, 0)
  for (let b = world.getBodyList(); b; b = b.getNext()) {
    if (!b.isDynamic()) continue;
    const p = b.getPosition(), r = Math.hypot(p.x, p.y), k = -b.getMass() * MU / (r * r * r);
    b.applyForceToCenter(V(p.x * k, p.y * k), true);
  }
}

/* ---------- engine limits (the speed caps built into Box2D) ---------- */
function readLimits() {
  const S = planck.Settings;
  return S ? { maxTranslation: S.maxTranslation, maxTranslationSquared: S.maxTranslationSquared, maxRotation: S.maxRotation } : null;
}
function applyLimits(o) {
  const S = planck.Settings;
  if (!S || !o) return false;
  try {
    for (const k in o) if (o[k] !== undefined) S[k] = o[k];
    return true;
  } catch (e) { log("could not change limits: " + e.message); return false; }
}

/* ---------- tests 1 and 2: drop a box and see if it stands ---------- */
const cv = document.getElementById("view"), c = cv.getContext("2d");
const W = cv.width, H = cv.height, S = 8;       // S = pixels per meter
let run = null, last = performance.now(), acc = 0;

function startDrop(kind) {
  const world = makeWorld();
  const ground = world.createBody({ type: "static", position: V(0, 0) });
  if (kind === "circle") {
    ground.createFixture({ shape: new planck.Circle(R), friction: 0.8 });
  } else {                                       // a row of flat 4 m pieces following the planet's curve
    const pts = [];
    for (let x = -600; x <= 600; x += 4) { const a = x / R; pts.push(V(R * Math.sin(a), R * Math.cos(a))); }
    ground.createFixture({ shape: new planck.Chain(pts, false), friction: 0.8 });
  }
  const b = world.createBody({ type: "dynamic", position: V(0, R + 33) });   // 30 m up, box is 6 m tall
  b.createFixture({ shape: new planck.Box(0.5, 3), density: 100, friction: 0.6 });
  run = { world: world, b: b, kind: kind, t: 0, done: false, maxSpeed: 0 };
  log("\n--- drop test, " + (kind === "circle" ? "circle ground" : "edge ground") + " (1 m wide, 6 m tall box, 30 m drop) ---");
}

function stepRun() {
  addGravity(run.world);
  run.world.step(DT, 8, 3);
  run.t += DT;
  const v = run.b.getLinearVelocity();
  run.maxSpeed = Math.max(run.maxSpeed, Math.hypot(v.x, v.y));
  if (!run.b.isAwake() || run.t > 30) { run.done = true; report(); }
}

function report() {
  const p = run.b.getPosition(), phi = Math.atan2(p.x, p.y);
  let tilt = (run.b.getAngle() + phi) * 180 / Math.PI;       // lean away from the local vertical
  tilt = ((tilt + 180) % 360 + 360) % 360 - 180;
  const alt = Math.hypot(p.x, p.y) - R;
  log("time " + run.t.toFixed(1) + " s, fell asleep: " + (!run.b.isAwake()) + ", top speed " + run.maxSpeed.toFixed(1) + " m/s");
  log("centre height " + alt.toFixed(3) + " m (3.000 if standing, 0.500 if lying down), lean " + tilt.toFixed(1) + " deg");
  log(Math.abs(tilt) < 5 ? "RESULT: stands upright" : "RESULT: fell over or is leaning");
}

function draw() {
  c.fillStyle = "#101418"; c.fillRect(0, 0, W, H);
  const gy = H - 40;
  c.fillStyle = "#3d5a2e"; c.fillRect(0, gy, W, H - gy);
  c.fillStyle = "#e8eef2"; c.font = "12px monospace";
  if (!run) { c.fillText("press button 1 or 2", 12, 20); return; }
  const p = run.b.getPosition(), phi = Math.atan2(p.x, p.y);
  const ux = Math.sin(phi), uy = Math.cos(phi), ex = Math.cos(phi), ey = -Math.sin(phi);
  const gx = R * ux, gyw = R * uy;                           // the ground point right below the box
  c.fillStyle = "#e67e22"; c.beginPath();
  [[-0.5, -3], [0.5, -3], [0.5, 3], [-0.5, 3]].forEach(function (q, i) {
    const w = run.b.getWorldPoint(V(q[0], q[1])), dx = w.x - gx, dy = w.y - gyw;
    const X = W / 2 + (dx * ex + dy * ey) * S, Y = gy - (dx * ux + dy * uy) * S;
    if (i === 0) c.moveTo(X, Y); else c.lineTo(X, Y);
  });
  c.closePath(); c.fill();
  c.fillStyle = "#e8eef2";
  c.fillText("t = " + run.t.toFixed(1) + " s   height of box centre = " + (Math.hypot(p.x, p.y) - R).toFixed(2) + " m" + (run.done ? "   (done)" : ""), 12, 20);
}

function frame(now) {
  const dtr = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (run && !run.done) {
    acc += dtr;
    while (acc >= DT && !run.done) { stepRun(); acc -= DT; }
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- tests 3 and 4: a small ball in a circular orbit ---------- */
function runOrbit(raised) {
  run = null;
  log("\n--- orbit test, " + (raised ? "RAISED" : "DEFAULT") + " engine limits ---");
  const original = readLimits();
  if (original) log("limits now: maxTranslation " + original.maxTranslation + " m per step, maxRotation " + original.maxRotation);
  else log("could not find planck.Settings, tell Claude (see the exported names above)");
  if (raised) {
    log("raising maxTranslation to 1000 m per step: " + (applyLimits({ maxTranslation: 1000, maxTranslationSquared: 1e6 }) ? "done" : "FAILED"));
  }
  const world = makeWorld();
  world.createBody({ type: "static", position: V(0, 0) }).createFixture({ shape: new planck.Circle(R) });
  const r0 = R + 100000, v0 = Math.sqrt(MU / r0), T = 2 * Math.PI * r0 / v0;
  const b = world.createBody({ type: "dynamic", position: V(0, r0) });
  b.createFixture({ shape: new planck.Circle(1), density: 1 });
  b.setLinearVelocity(V(v0, 0));
  log("100 km up, speed " + v0.toFixed(1) + " m/s, one orbit should take " + T.toFixed(0) + " s. Running 3 orbits...");

  const n = Math.round(3 * T / DT), t0 = performance.now();
  let rmin = Infinity, rmax = -Infinity, hit = false, i = 0;
  for (; i < n; i++) {
    addGravity(world);
    world.step(DT, 8, 3);
    const p = b.getPosition(), r = Math.hypot(p.x, p.y);
    if (r < rmin) rmin = r;
    if (r > rmax) rmax = r;
    if (!(r > R + 5)) { hit = true; break; }                // hit the ground (or went to NaN)
  }
  const v = b.getLinearVelocity();
  log("ran " + (i * DT / T).toFixed(2) + " orbits in " + ((performance.now() - t0) / 1000).toFixed(1) + " s of computer time");
  log("altitude ranged from " + ((rmin - R) / 1000).toFixed(3) + " to " + ((rmax - R) / 1000).toFixed(3) + " km (started at 100.000)");
  log("final speed " + Math.hypot(v.x, v.y).toFixed(1) + " m/s (started at " + v0.toFixed(1) + ")");
  log(hit ? "RESULT: FAILED, the ball fell to the ground"
          : (rmax - rmin < 1000 ? "RESULT: held a steady orbit (altitude wobble under 1 km)" : "RESULT: orbit drifted by " + ((rmax - rmin) / 1000).toFixed(1) + " km"));
  if (original) applyLimits(original);                       // put the default limits back
}

function runLater(f) { log("\nrunning, this can take a few seconds..."); setTimeout(f, 60); }

document.getElementById("b1").onclick = function () { startDrop("circle"); };
document.getElementById("b2").onclick = function () { startDrop("edge"); };
document.getElementById("b3").onclick = function () { runLater(function () { runOrbit(false); }); };
document.getElementById("b4").onclick = function () { runLater(function () { runOrbit(true); }); };
document.getElementById("b5").onclick = function () { logEl.textContent = ""; };
</script>
</body>
</html>
