<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step 2: a rocket made of parts</title>
<style>
  body { margin: 0; background: #101418; color: #e8eef2; font: 13px/1.4 monospace; padding: 12px; }
  button { font: inherit; color: #e8eef2; background: #1b242c; border: 1px solid rgba(255,255,255,0.25);
           padding: 6px 10px; margin: 0 6px 6px 0; cursor: pointer; }
  button:hover { background: #26333d; }
  label { margin-left: 8px; }
  canvas { display: block; margin: 6px 0; border: 1px solid rgba(255,255,255,0.15); }
  pre { white-space: pre-wrap; margin: 0; }
</style>
</head>
<body>
<div>
  <b>Step 2: a rocket made of parts</b> (engine, tank, nose, two legs, joined by weld joints, dropped onto the 600 km planet)<br><br>
  Drop height, feet to ground:
  <button data-h="1">1 m</button>
  <button data-h="5">5 m</button>
  <button data-h="20">20 m</button>
  <button data-h="80">80 m</button>
  <button data-h="320">320 m</button>
  <button data-h="1280">1280 m</button><br>
  <label><input type="checkbox" id="canBreak"> joints can break</label>
  <button id="warp">Speed: 1x</button>
  <button id="clear">Clear log</button>
</div>
<canvas id="view" width="760" height="420"></canvas>
<pre id="log"></pre>

<script src="js/planck.min.js"></script>
<script>
"use strict";

const logEl = document.getElementById("log");
function log(s) { logEl.textContent += s + "\n"; }

if (typeof planck === "undefined") {
  log("planck was not found. Check that the file is at js/planck.min.js next to this page. Then reload.");
  throw new Error("planck missing");
}

const R = 600000;                    // planet radius, m
const G0 = 9.81;                     // surface gravity, m/s2
const MU = G0 * R * R;               // gravity strength: force = m * MU / r^2
const DT = 1 / 60;                   // physics step, s
const VEL_IT = 16, POS_IT = 6;       // solver effort per step (more = stiffer joints, slower)
const P = (x, y) => new planck.Vec2(x, y);

/* The engine's built-in speed cap (2 m per step) would hold everything below 120 m/s. Step 1 showed that
   raising it works. */
try {
  planck.Settings.maxTranslation = 1000;
  planck.Settings.maxTranslationSquared = 1e6;
  log("raised the engine's speed cap (maxTranslation) to 1000 m per step");
} catch (e) { log("could not raise the speed cap: " + e.message); }

/* How much each joint can take before it snaps (only used when "joints can break" is ticked).
   F = pulling or pushing force in newtons, T = twisting force in newton-meters.
   These are PLACEHOLDERS. We pick real numbers after seeing the peaks that each drop produces. */
const STRENGTH = {
  "engine mount": { F: 3e5, T: 3e5 },
  "nose mount":   { F: 3e5, T: 3e5 },
  "left leg":     { F: 3e5, T: 3e5 },
  "right leg":    { F: 3e5, T: 3e5 }
};

function addGravity(world) {         // pull every dynamic body toward the planet's center (0, 0)
  for (let b = world.getBodyList(); b; b = b.getNext()) {
    if (!b.isDynamic()) continue;
    const p = b.getPosition(), r = Math.hypot(p.x, p.y), k = -b.getMass() * MU / (r * r * r);
    b.applyForceToCenter(P(p.x * k, p.y * k), true);
  }
}

function polyArea(v) {
  let a = 0;
  for (let i = 0; i < v.length; i++) { const p = v[i], q = v[(i + 1) % v.length]; a += p.x * q.y - q.x * p.y; }
  return Math.abs(a) / 2;
}

function bar(end, th) {              // a thin straight bar from (0,0) to end, th thick
  const L = Math.hypot(end.x, end.y), nx = -end.y / L * th / 2, ny = end.x / L * th / 2;
  return [P(nx, ny), P(end.x + nx, end.y + ny), P(end.x - nx, end.y - ny), P(-nx, -ny)];
}

/* ---------- build the rocket and drop it ---------- */
const cv = document.getElementById("view"), c = cv.getContext("2d");
const W = cv.width, H = cv.height, S = 11;      // S = pixels per meter
let run = null, last = performance.now(), acc = 0, warp = 1;

function startDrop(h) {
  const world = new planck.World({ gravity: P(0, 0) });
  world.createBody({ type: "static", position: P(0, 0) }).createFixture({ shape: new planck.Circle(R), friction: 0.8 });

  const parts = [], joints = [];
  const base = R + h + 0.1;                       // the engine's bottom; the feet hang 0.1 m lower

  function add(name, color, x, y, verts, mass) {  // one part: a body whose weight is "mass" kg
    const b = world.createBody({ type: "dynamic", position: P(x, y) });
    b.createFixture({ shape: new planck.Polygon(verts), density: mass / polyArea(verts), friction: 0.8, restitution: 0 });
    parts.push({ name: name, color: color, body: b, verts: verts });
    return b;
  }
  function link(name, a, b, x, y) {               // weld two parts together at a world point
    const j = world.createJoint(new planck.WeldJoint({ frequencyHz: 0, dampingRatio: 0 }, a, b, P(x, y)));
    joints.push({ name: name, j: j, a: a, b: b, peakF: 0, peakT: 0, broken: false, max: STRENGTH[name] });
  }

  const eng  = add("engine", "#7f8c8d", 0, base + 0.5,  [P(-0.5, -0.5), P(0.5, -0.5), P(0.6, 0.5), P(-0.6, 0.5)], 300);
  const tank = add("tank",   "#ecf0f1", 0, base + 3.0,  [P(-1, -2), P(1, -2), P(1, 2), P(-1, 2)], 2000);
  const nose = add("nose",   "#e67e22", 0, base + 5.75, [P(-1, -0.75), P(1, -0.75), P(0.2, 0.75), P(-0.2, 0.75)], 150);
  const legL = add("left leg",  "#95a5a6", -1, base + 1.4, bar(P(-1.4, -1.5), 0.2), 50);
  const legR = add("right leg", "#95a5a6",  1, base + 1.4, bar(P( 1.4, -1.5), 0.2), 50);

  link("engine mount", tank, eng,  0, base + 1.0);
  link("nose mount",   tank, nose, 0, base + 5.0);
  link("left leg",     tank, legL, -1, base + 1.4);
  link("right leg",    tank, legR,  1, base + 1.4);

  run = { world: world, parts: parts, joints: joints, t: 0, done: false, maxSpeed: 0, h: h,
          canBreak: document.getElementById("canBreak").checked };
  log("\n--- drop from " + h + " m (impact about " + Math.sqrt(2 * G0 * h).toFixed(1) + " m/s), joints " +
      (run.canBreak ? "CAN break" : "cannot break, just measuring") + " ---");
}

function focusBody() {
  const t = run.parts.find(p => p.name === "tank") || run.parts[0];
  return t ? t.body : null;
}

function stepRun() {
  const w = run.world;
  addGravity(w);
  w.step(DT, VEL_IT, POS_IT);
  run.t += DT;

  const inv = 1 / DT;                             // reaction forces are per second, so we pass 1/step
  for (const j of run.joints) {
    if (j.broken) continue;
    const f = j.j.getReactionForce(inv), fm = Math.hypot(f.x, f.y), tq = Math.abs(j.j.getReactionTorque(inv));
    if (fm > j.peakF) j.peakF = fm;
    if (tq > j.peakT) j.peakT = tq;
    if (run.canBreak && (fm > j.max.F || tq > j.max.T)) {
      w.destroyJoint(j.j);
      j.broken = true;
      log("T+" + run.t.toFixed(2) + " s: " + j.name + " SNAPPED (force " + (fm / 1000).toFixed(0) + " kN, twist " + (tq / 1000).toFixed(0) + " kN*m)");
    }
  }

  for (let i = run.parts.length - 1; i >= 0; i--) {   // a piece that ended up inside the planet is deleted
    const p = run.parts[i], q = p.body.getPosition();
    if (Math.hypot(q.x, q.y) < R - 1) {
      log("T+" + run.t.toFixed(2) + " s: the " + p.name + " went through the ground and was deleted");
      w.destroyBody(p.body);
      for (const j of run.joints) if (j.a === p.body || j.b === p.body) j.broken = true;
      run.parts.splice(i, 1);
    }
  }

  const fb = focusBody();
  if (fb) { const v = fb.getLinearVelocity(); run.maxSpeed = Math.max(run.maxSpeed, Math.hypot(v.x, v.y)); }
  let anyAwake = false;
  for (const p of run.parts) if (p.body.isAwake()) anyAwake = true;
  if (!anyAwake || run.t > 45 || !fb) { run.done = true; report(); }
}

function report() {
  log("time " + run.t.toFixed(1) + " s, top speed " + run.maxSpeed.toFixed(1) + " m/s, pieces left: " + run.parts.length + " of 5");
  for (const j of run.joints) {
    log("  " + (j.name + "            ").slice(0, 13) + " peak force " + (j.peakF / 1000).toFixed(0).padStart(6) + " kN   peak twist " +
        (j.peakT / 1000).toFixed(0).padStart(6) + " kN*m" + (j.broken ? "   BROKE" : ""));
  }
  const fb = focusBody();
  if (fb) {
    const p = fb.getPosition(), phi = Math.atan2(p.x, p.y);
    let tilt = (fb.getAngle() + phi) * 180 / Math.PI;
    tilt = ((tilt + 180) % 360 + 360) % 360 - 180;
    log("tank centre height " + (Math.hypot(p.x, p.y) - R).toFixed(2) + " m (about 3.4 if standing on its legs), lean " + tilt.toFixed(1) + " deg");
    log(Math.abs(tilt) < 5 ? "RESULT: standing" : "RESULT: leaning or fallen over");
  }
}

/* ---------- drawing (the camera follows the tank, ground is drawn flat below it) ---------- */
function draw() {
  c.fillStyle = "#101418"; c.fillRect(0, 0, W, H);
  const gy = H - 50;
  c.fillStyle = "#3d5a2e"; c.fillRect(0, gy, W, H - gy);
  c.font = "12px monospace";
  const fb = run && !run.done || run && run.parts.length ? focusBody() : null;
  if (!run || !fb) { c.fillStyle = "#e8eef2"; c.fillText("pick a drop height", 12, 20); return; }
  const p = fb.getPosition(), phi = Math.atan2(p.x, p.y);
  const ux = Math.sin(phi), uy = Math.cos(phi), ex = Math.cos(phi), ey = -Math.sin(phi);
  const gx = R * ux, gyw = R * uy;
  const camUp = Math.max(0, Math.hypot(p.x, p.y) - R - 8);     // while it is high up, keep it near the middle
  const lift = Math.min(camUp, 1e9);
  for (const part of run.parts) {
    c.fillStyle = part.color;
    c.beginPath();
    part.verts.forEach(function (q, i) {
      const wv = part.body.getWorldPoint(q), dx = wv.x - gx, dy = wv.y - gyw;
      const X = W / 2 + (dx * ex + dy * ey) * S;
      const Y = Math.min(gy + 2000, gy - (dx * ux + dy * uy - lift) * S);
      if (i === 0) c.moveTo(X, Y); else c.lineTo(X, Y);
    });
    c.closePath(); c.fill();
  }
  if (lift === 0) { c.strokeStyle = "rgba(255,255,255,0.4)"; c.beginPath(); c.moveTo(0, gy); c.lineTo(W, gy); c.stroke(); }
  c.fillStyle = "#e8eef2";
  const v = fb.getLinearVelocity();
  c.fillText("t = " + run.t.toFixed(1) + " s   tank height " + (Math.hypot(p.x, p.y) - R).toFixed(1) + " m   speed " +
             Math.hypot(v.x, v.y).toFixed(1) + " m/s" + (run.done ? "   (done)" : ""), 12, 20);
}

function frame(now) {
  const dtr = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (run && !run.done) {
    acc += dtr * warp;
    let n = 0;
    while (acc >= DT && !run.done && n < 2000) { stepRun(); acc -= DT; n++; }
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

for (const b of document.querySelectorAll("button[data-h]")) {
  b.onclick = function () { startDrop(Number(b.dataset.h)); };
}
document.getElementById("warp").onclick = function () {
  warp = warp === 1 ? 4 : warp === 4 ? 16 : 1;
  this.textContent = "Speed: " + warp + "x";
};
document.getElementById("clear").onclick = function () { logEl.textContent = ""; };
</script>
</body>
</html>
